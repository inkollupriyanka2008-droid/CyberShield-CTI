<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CyberShield CTI</title>
<style>
:root{--bg:#060c17;--pn:#0c1525;--p2:#111e34;--bd:#1b2b45;--tx:#dbe7f7;--mu:#7d92b0;--cy:#22d3ee;--gr:#34f5a0;--rd:#ff4d6a;--am:#fbbf24;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef3fa;--pn:#fff;--p2:#f1f5fb;--bd:#d3dded;--tx:#10203a;--mu:#5b6f8c;--cy:#0891b2;--gr:#059669;--rd:#dc2626;--am:#b45309;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:var(--pn);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:800;color:var(--cy);font-size:17px;padding:4px 10px 14px;letter-spacing:.5px}.logo small{display:block;color:var(--mu);font-weight:500;font-size:11px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--mu);padding:10px 12px;border-radius:6px;font:inherit;cursor:pointer}
nav button:hover{background:var(--p2);color:var(--tx)}nav button.on{border-left-color:var(--gr);background:var(--p2);color:var(--gr)}
main{flex:1;min-width:0;padding:22px;max-width:1200px}
h1{margin:0 0 4px;font-size:22px}h2{font-size:15px;margin:0 0 12px}.sub{color:var(--mu);margin:0 0 18px}
.demo{background:rgba(251,191,36,.12);border:1px solid var(--am);color:var(--am);padding:8px 12px;border-radius:8px;margin-bottom:16px;font-size:12.5px}
.g{display:grid;gap:14px}.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.c{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:16px;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.m b{display:block;font-size:28px;color:var(--c,var(--cy))}.m span{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.b{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;color:var(--c);border:1px solid var(--c)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;text-transform:uppercase;cursor:pointer}
td.v{max-width:260px;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}.sc{overflow-x:auto}
input,select,textarea{background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;font:inherit;min-width:0}input:focus,select:focus{outline:2px solid var(--cy)}
.btn{background:var(--cy);color:#04121c;border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}.btn.s{background:var(--p2);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--rd);color:#fff}.btn.t{padding:3px 8px;font-size:12px}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row input{flex:1;min-width:150px}
.pie{width:150px;height:150px;border-radius:50%;margin:auto}.lg{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:12px;color:var(--mu)}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars u{display:block;background:linear-gradient(var(--cy),var(--gr));border-radius:4px 4px 0 0;min-height:2px;text-decoration:none}
.hb{margin:8px 0;font-size:12.5px}.hb u{display:block;height:8px;background:var(--c);border-radius:4px;margin-top:3px;text-decoration:none}
.al{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-left:4px solid var(--c);background:var(--pn);border-radius:8px;padding:12px;margin-bottom:10px;border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}.al.u{background:var(--p2)}
.err{color:var(--rd);font-size:13px;margin:4px 0}.mu{color:var(--mu)}.mono{font-family:ui-monospace,Consolas,monospace;word-break:break-all}
#m{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#m>div{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
#t{position:fixed;right:16px;bottom:16px;background:var(--gr);color:#04121c;padding:10px 16px;border-radius:8px;font-weight:600;display:none;z-index:10}
.sp{display:inline-block;width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--cy);border-radius:50%;animation:r .7s linear infinite;vertical-align:middle}@keyframes r{to{transform:rotate(360deg)}}
@media(max-width:800px){body{display:block}nav{width:100%;height:auto;position:sticky;top:0;z-index:5;display:flex;overflow-x:auto;padding:6px;gap:2px;border-right:0;border-bottom:1px solid var(--bd)}.logo{display:none}nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent}nav button.on{border-bottom-color:var(--gr)}main{padding:14px}}
</style></head><body>
<nav id="nav"><div class="logo">🛡 CyberShield CTI<small>Threat Intelligence Platform</small></div></nav>
<main id="main"></main><div id="m"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),D=864e5,uid=()=>Math.random().toString(36).slice(2,9),dt=t=>new Date(t).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});
const LV=['High','Medium','Low','Unknown','Invalid'],COL={High:'var(--rd)',Medium:'var(--am)',Low:'var(--gr)',Unknown:'#8b9bb4',Invalid:'#a78bfa'},TY={ip:'IP address',domain:'Domain',url:'URL',hash:'File hash'};
const lvl=s=>s==null?'Unknown':s>=70?'High':s>=40?'Medium':'Low',bd=l=>`<span class="b" style="--c:${COL[l]}">${l}</span>`;
function chk(v,t){if(t=='ip')return /^((25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(25[0-5]|2[0-4]\d|1?\d?\d)$/.test(v)||'Enter a valid IPv4 address, e.g. 203.0.113.45';
if(t=='domain')return /^(?=.{4,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,24}$/i.test(v)||'Enter a valid domain, e.g. example.com';
if(t=='url'){try{const u=new URL(v);return(/^https?:$/.test(u.protocol)&&u.hostname.includes('.'))||'URL must start with http:// or https://'}catch(e){return 'Enter a full URL, e.g. https://example.com/path'}}
return /^([a-f0-9]{32}|[a-f0-9]{40}|[a-f0-9]{64})$/i.test(v)||'Hash must be MD5 (32), SHA-1 (40) or SHA-256 (64) hex characters'}
const KW=['login','secure','update','verify','free','malware','phish','evil','payload'],BT=['xyz','top','click','zip'],RG={'203.0.113':60,'198.51.100':45,'192.0.2':20};
function sig(v,t){let p=0,ev=[],a=(n,m)=>{p+=n;ev.push('+'+n+' '+m)},h=v;
if(t=='ip'){if(/^(10\.|192\.168\.|127\.|172\.(1[6-9]|2\d|3[01])\.)/.test(v))ev.push('Private/loopback address: internal, not assessable externally');else{const r=RG[v.split('.').slice(0,3).join('.')];if(r)a(r,'Address in demo watchlist range (documentation block)')}}
if(t=='hash'&&v.toLowerCase()=='44d88612fea8a8f36de82e1278abb02f')a(76,'Matches demo known-bad hash list (EICAR test file)');
if(t=='url'){try{const u=new URL(v);h=u.hostname;if(/\.(exe|bin|scr|zip|js)$/i.test(u.pathname))a(25,'Executable/archive extension in path');if(u.protocol=='http:')a(10,'Unencrypted HTTP');if(/^\d+\.\d+\.\d+\.\d+$/.test(h))a(15,'Raw IP used as host')}catch(e){}}
if(t=='domain'||t=='url'){const k=KW.filter(w=>v.toLowerCase().includes(w));if(k.length)a(Math.min(k.length*20,50),'Suspicious keywords: '+k.join(', '));if(BT.includes(h.split('.').pop().toLowerCase()))a(15,'Low-reputation TLD in demo list');if(h.length>30)a(10,'Unusually long hostname');if((h.match(/-/g)||[]).length>=2)a(10,'Multiple hyphens in hostname')}
return{p:Math.min(p,100),ev,hit:ev.some(e=>e[0]=='+')}}
function mk(v,t,src,f=Date.now(),k=f){const ok=chk(v,t)===true,r={id:uid(),v,t,src,f,k,ok};if(!ok){Object.assign(r,{s:null,l:'Invalid',c:'N/A',ev:['Failed format validation: not analyzed']});return r}
const g=sig(v,t);r.s=g.hit?g.p:null;r.l=lvl(r.s);r.c=!g.hit?'N/A':t=='hash'?'High':g.ev.length>2?'Medium':'Low';r.ev=g.ev.length?g.ev:['No signals in demo intelligence. Result is Unknown, not “safe”.'];return r}
const SRC={ip:'Demo Honeypot Feed',domain:'Demo Phishing Feed',url:'Demo URL Feed',hash:'Demo Malware Feed'},USR='Analyst Submission (simulated)';
function seed(){const L=[['203.0.113.45','ip',3],['198.51.100.23','ip',9],['192.0.2.77','ip',15],['10.0.4.12','ip',2],['login-secure-update.example','domain',1],['cdn-assets.example','domain',20],['free-gift-verify.top','domain',5],['http://malware-drop.example/payload.bin','url',2],['https://docs.example/help','url',12],['44d88612fea8a8f36de82e1278abb02f','hash',4],['e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855','hash',30],['999.1.1.1','ip',6]];
const S={ind:L.map(([v,t,d],i)=>mk(v,t,SRC[t],Date.now()-d*D,Date.now()-(d%7)*D-i*36e5)),al:[],fd:{},p:{theme:'dark',ps:8,oa:true}};S.ind.filter(r=>r.l=='High'||r.l=='Medium').forEach(r=>addAl(r,S,r.k));Object.values(SRC).concat(USR).forEach(n=>S.fd[n]=Date.now());return S}
function addAl(r,S0=S,t=Date.now()){if(!r.ok||r.l=='Unknown')return;S0.al.unshift({id:uid(),sev:r.l,ind:r.id,v:r.v,t,d:`${r.l}-risk ${TY[r.t].toLowerCase()} scored ${r.s}/100 in simulated analysis. Investigate before acting.`,rd:false})}
let S,U={q:'',ty:'',lv:'',sk:'k',dr:-1,pg:1,af:'all'},P='ov';
function load(){try{S=JSON.parse(localStorage.getItem('cscti2'))}catch(e){}if(!S||!S.ind)S=seed()}function save(){try{localStorage.setItem('cscti2',JSON.stringify(S))}catch(e){}}
const toast=m=>{const e=$('#t');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2600)};
const modal=h=>{const e=$('#m');e.innerHTML='<div>'+h+'</div>';e.style.display='flex'},close=()=>$('#m').style.display='none';
const cnt=()=>{const c={};LV.forEach(l=>c[l]=0);S.ind.forEach(r=>c[r.l]++);return c};
const pie=c=>{let a=0,tot=S.ind.length||1;return`<div class="pie" style="background:conic-gradient(${LV.map(l=>{const s=a;a+=c[l]/tot*100;return`${COL[l]} ${s}% ${a}%`}).join(',')})"></div><div class="lg">${LV.map(l=>`<span><i style="background:${COL[l]}"></i>${l} ${c[l]}</span>`).join('')}</div>`};
const act=()=>{const o=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*D),n=S.ind.filter(r=>new Date(r.k).toDateString()==d.toDateString()).length;o.push([d.toLocaleDateString([],{weekday:'short'}),n])}return o};
const bars=a=>{const m=Math.max(1,...a.map(x=>x[1]));return`<div class="bars">${a.map(([l,n])=>`<div>${n}<u style="height:${n/m*100}%"></u>${l}</div>`).join('')}</div>`};
const hb=(l,n,t,c)=>`<div class="hb">${l} <span class="mu">${n}</span><u style="--c:${c};width:${Math.max(2,n/(t||1)*100)}%"></u></div>`;
const dm='<div class="demo">⚠ <b>DEMO MODE</b>: all data and scores are simulated by a transparent rule-based algorithm. This is not verified threat intelligence and no external feeds are connected.</div>';
const rows=a=>a.map(r=>`<tr><td class="v" title="${esc(r.v)}">${esc(r.v)}</td><td>${TY[r.t]}</td><td>${r.s??'—'}</td><td>${bd(r.l)}</td><td>${esc(r.src)}</td><td>${r.c}</td><td>${dt(r.f)}</td><td>${dt(r.k)}</td><td><button class="btn s t" data-a="view" data-i="${r.id}">View</button> <button class="btn d t" data-a="del" data-i="${r.id}">Delete</button></td></tr>`).join('');
const steps=r=>{const o={ip:['Check firewall/proxy logs for connections to this IP','Look up WHOIS/ASN ownership and passive DNS','Consider a temporary block pending review'],domain:['Search DNS and proxy logs for lookups of this domain','Check registration age and registrar','Review email gateway for messages linking to it'],url:['Do NOT open it from a work machine; use an isolated sandbox','Check web proxy logs for who requested it','Submit to a URL scanner you are authorised to use'],hash:['Search endpoint telemetry for this hash','Check it against a trusted malware database','Isolate affected hosts if it is found']}[r.t];
return r.l=='Unknown'?['No reliable intelligence: do not treat as safe or malicious',...o.slice(0,2),'Re-check after configuring an authorised backend feed']:r.l=='Invalid'?['Correct the format and re-submit']:r.l=='High'?[...o,'Escalate to the incident response lead']:o}
const rc=r=>`<div class="c"><div class="row" style="justify-content:space-between"><h2 class="mono" style="margin:0">${esc(r.v)}</h2>${bd(r.l)}</div><p class="mu">${TY[r.t]} · <b>SIMULATED analysis (demo scoring)</b></p>
<div class="g g5"><div class="m" style="--c:${COL[r.l]}"><b>${r.s??'—'}</b><span>Risk score / 100</span></div><div class="m"><b style="font-size:20px">${r.c}</b><span>Confidence</span></div></div>
<h2 style="margin-top:14px">Evidence summary</h2><ul>${r.ev.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><p class="mu">Source: ${esc(r.src)} · First seen ${dt(r.f)} · Last checked ${dt(r.k)}</p>
<h2>Recommended investigation steps</h2><ol>${steps(r).map(s=>`<li>${s}</li>`).join('')}</ol></div>`;
function fl(){const q=U.q.toLowerCase(),o={High:0,Medium:1,Low:2,Unknown:3,Invalid:4};let a=S.ind.filter(r=>(!q||(r.v+r.src).toLowerCase().includes(q))&&(!U.ty||r.t==U.ty)&&(!U.lv||r.l==U.lv));
const g=r=>U.sk=='s'?(r.s??-1):U.sk=='l'?o[r.l]:r[U.sk];return a.sort((x,y)=>(g(x)>g(y)?1:g(x)<g(y)?-1:0)*U.dr)}
function tb(){const a=fl(),ps=S.p.ps,pg=Math.min(U.pg,Math.max(1,Math.ceil(a.length/ps)));U.pg=pg;const n=Math.ceil(a.length/ps);
$('#tb').innerHTML=`<div class="c sc"><table><tr>${[['v','Indicator'],['t','Type'],['s','Score'],['l','Risk'],['src','Source'],['c','Confidence'],['f','First seen'],['k','Last checked']].map(([k,l])=>`<th data-a="sort" data-k="${k}">${l}${U.sk==k?(U.dr>0?' ▲':' ▼'):''}</th>`).join('')}<th>Actions</th></tr>${a.length?rows(a.slice((pg-1)*ps,pg*ps)):''}</table>${a.length?'':'<p class="mu" style="text-align:center;padding:24px">No indicators match your filters.</p>'}</div>
<div class="row" style="margin-top:10px"><span class="mu">${a.length} records · page ${pg}/${Math.max(n,1)}</span><button class="btn s t" data-a="pg" data-d="-1" ${pg<2?'disabled':''}>Prev</button><button class="btn s t" data-a="pg" data-d="1" ${pg>=n?'disabled':''}>Next</button></div>`}
const opts=(o,sel)=>o.map(([v,l])=>`<option value="${v}" ${v==sel?'selected':''}>${l}</option>`).join(''),tyo=Object.entries(TY);
const PG={
ov(){const c=cnt(),by={};S.ind.forEach(r=>(by[r.src]=by[r.src]||[]).push(r));return`<h1>Overview</h1><p class="sub">SOC threat intelligence dashboard</p>${dm}
<div class="g g5">${[['Total indicators',S.ind.length,'var(--cy)'],['High risk',c.High,COL.High],['Medium risk',c.Medium,COL.Medium],['Low risk',c.Low,COL.Low],['Invalid',c.Invalid,COL.Invalid]].map(([l,n,k])=>`<div class="c m" style="--c:${k}"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
<div class="g g2" style="margin-top:14px"><div class="c"><h2>Threat distribution</h2>${pie(c)}</div><div class="c"><h2>Threat activity (checks, last 7 days)</h2>${bars(act())}</div></div>
<div class="g g2" style="margin-top:14px"><div class="c sc"><h2>Recent analysis</h2><table>${[...S.ind].sort((a,b)=>b.k-a.k).slice(0,5).map(r=>`<tr><td class="v">${esc(r.v)}</td><td>${bd(r.l)}</td><td>${dt(r.k)}</td></tr>`).join('')}</table></div>
<div class="c"><h2>Threat source summary</h2>${Object.entries(by).map(([s,a])=>hb(esc(s),a.length,S.ind.length,'var(--cy)')).join('')}</div></div>
${S.p.oa?`<div class="c" style="margin-top:14px"><h2>Latest threat alerts</h2>${S.al.slice(0,4).map(al).join('')||'<p class="mu">No alerts yet.</p>'}</div>`:''}`},
an(){return`<h1>Threat Analyzer</h1><p class="sub">Analyze an IP, domain, URL or file hash</p>${dm}<div class="c"><div class="row"><select id="at">${opts(tyo)}</select><input id="av" placeholder="e.g. 203.0.113.45" autocomplete="off"><button class="btn" data-a="run">Analyze</button></div><div class="err" id="er"></div><p class="mu">Scoring is rule-based. Indicators with no signals are shown as <b>Unknown</b>, never as malicious. URLs are analyzed as text only and are never opened.</p></div><div id="res" style="margin-top:14px"></div>`},
ind(){return`<h1>Indicators</h1><p class="sub">Search, filter, add and manage indicators</p><div class="row"><input id="q" data-f="q" placeholder="Search indicator or source…" value="${esc(U.q)}"><select data-f="ty">${opts([['','All types'],...tyo],U.ty)}</select><select data-f="lv">${opts([['','All levels'],...LV.map(l=>[l,l])],U.lv)}</select><button class="btn" data-a="addf">+ Add</button><button class="btn s" data-a="csv">Export CSV</button></div><div id="tb"></div>`},
fd(){return`<h1>Threat Feeds</h1><p class="sub">Intelligence source management</p><div class="demo">⚠ <b>DEMO MODE</b>: these are mock feeds. No external service is connected; Refresh only simulates a sync.</div><div class="c sc"><table><tr><th>Source</th><th>Type</th><th>Status</th><th>Last sync</th><th>Indicators</th><th></th></tr>${Object.keys(S.fd).map(n=>`<tr><td>${esc(n)}</td><td>${n==USR?'Manual':'Simulated feed'}</td><td>${bd('Unknown').replace('Unknown','Demo')}</td><td>${dt(S.fd[n])}</td><td>${S.ind.filter(r=>r.src==n).length}</td><td><button class="btn s t" data-a="sync" data-n="${esc(n)}">Refresh</button></td></tr>`).join('')}</table></div>`},
al(){const f=U.af,a=S.al.filter(x=>f=='all'||(f=='unread'?!x.rd:x.sev==f));return`<h1>Alerts</h1><p class="sub">Generated from demo data and your analysis actions</p><div class="row">${['all','High','Medium','Low','unread'].map(x=>`<button class="btn ${f==x?'':'s'} t" data-a="af" data-k="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}<button class="btn s t" data-a="rdall">Mark all read</button></div>${a.map(al).join('')||'<div class="c mu">No alerts match this filter.</div>'}`},
rp(){const c=cnt(),n=fl().length,tc={};S.ind.forEach(r=>tc[r.t]=(tc[r.t]||0)+1);return`<h1>Reports</h1><p class="sub">Statistics and export</p>${dm}<div class="g g5"><div class="c m"><b>${S.ind.filter(r=>r.ok).length}</b><span>Indicators analyzed</span></div><div class="c m" style="--c:var(--rd)"><b>${c.High}</b><span>High risk</span></div><div class="c m" style="--c:var(--am)"><b>${c.Medium}</b><span>Medium</span></div><div class="c m" style="--c:var(--gr)"><b>${c.Low}</b><span>Low</span></div></div>
<div class="g g2" style="margin-top:14px"><div class="c"><h2>Risk distribution</h2>${LV.map(l=>hb(l,c[l],S.ind.length,COL[l])).join('')}</div><div class="c"><h2>Indicator types</h2>${tyo.map(([k,l])=>hb(l,tc[k]||0,S.ind.length,'var(--cy)')).join('')}</div></div>
<div class="c" style="margin-top:14px"><h2>Recent activity</h2>${bars(act())}</div><div class="c" style="margin-top:14px"><button class="btn" data-a="csv">Export report (CSV)</button> <span class="mu">Exports the ${n} record(s) matching the current filters on the Indicators page.</span></div>`},
st(){return`<h1>Settings</h1><p class="sub">Preferences and scoring transparency</p><div class="g g2"><div class="c"><h2>Theme</h2><div class="row">${['dark','light'].map(t=>`<button class="btn ${S.p.theme==t?'':'s'}" data-a="th" data-k="${t}">${t}</button>`).join('')}</div><h2>Dashboard</h2><div class="row"><label>Rows per page <select data-f="ps">${opts([[5,5],[8,8],[15,15],[25,25]],S.p.ps)}</select></label><label><input type="checkbox" data-f="oa" ${S.p.oa?'checked':''}> Show alerts on overview</label></div><h2>Demo mode</h2><p><b style="color:var(--am)">ACTIVE</b>: no API keys or credentials are stored in the browser. Real intelligence needs a backend with authorized sources.</p><button class="btn d" data-a="reset">Reset demo data</button></div>
<div class="c"><h2>How scoring works (demo)</h2><ul><li>Each rule adds points: keywords (+20 each, max 50), low-reputation TLD (+15), executable path (+25), HTTP (+10), long host (+10), many hyphens (+10), demo watchlist ranges/hashes.</li><li>Total is capped at 100. High ≥ 70, Medium 40–69, Low 1–39.</li><li>No matching signal → <b>Unknown</b> (never “safe” or “malicious”).</li><li>Wrong format → <b>Invalid</b>.</li></ul></div></div>`}};
const al=x=>{const ex=S.ind.some(r=>r.id==x.ind);return`<div class="al ${x.rd?'':'u'}" style="--c:${COL[x.sev]}"><div>${bd(x.sev)} <b class="mono">${esc(x.v)}</b> ${x.rd?'':'<span class="b" style="--c:var(--cy)">NEW</span>'}<br>${x.d}<br><span class="mu">${dt(x.t)}</span></div><div>${ex?`<button class="btn s t" data-a="view" data-i="${x.ind}">Details</button> `:''}<button class="btn s t" data-a="rd" data-i="${x.id}">${x.rd?'Mark unread':'Mark read'}</button></div></div>`};
function go(p){if(p)P=p;if(!PG[P])P='ov';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==P));$('#main').innerHTML=PG[P]();if(P=='ind')tb();window.scrollTo(0,0)}
function sub(t,v,src,cb){v=v.trim();const ok=chk(v,t);if(ok!==true)return ok;const i=S.ind.findIndex(r=>r.v.toLowerCase()==v.toLowerCase()&&r.t==t),n=mk(v,t,src);if(i>=0){n.f=S.ind[i].f;n.id=S.ind[i].id;n.src=S.ind[i].src;S.ind[i]=n}else S.ind.unshift(n);addAl(n);save();cb(n);return true}
const A={nav:e=>{try{location.hash=e.dataset.p}catch(x){}go(e.dataset.p)},
run(){const t=$('#at').value,v=$('#av').value.trim();$('#er').textContent='';if(!v){$('#er').textContent='Please enter an indicator.';return}
const ok=chk(v,t);if(ok!==true){$('#er').textContent=ok;if(!S.ind.some(r=>r.v==v&&r.t==t&&!r.ok)){S.ind.unshift(mk(v,t,USR));save()}toast('Invalid format logged');return}
$('#res').innerHTML='<div class="c"><span class="sp"></span> Analyzing (simulated)…</div>';setTimeout(()=>sub(t,v,USR,n=>{$('#res').innerHTML=rc(n);toast('Analysis complete')}),700)},
view(e){const r=S.ind.find(x=>x.id==e.dataset.i);if(r)modal(rc(r)+'<p style="text-align:right"><button class="btn s" data-a="x">Close</button></p>')},
del(e){const r=S.ind.find(x=>x.id==e.dataset.i);modal(`<h2>Delete indicator?</h2><p class="mono">${esc(r.v)}</p><p class="mu">This also removes its alerts.</p><button class="btn d" data-a="delok" data-i="${r.id}">Delete</button> <button class="btn s" data-a="x">Cancel</button>`)},
delok(e){const i=e.dataset.i;S.ind=S.ind.filter(r=>r.id!=i);S.al=S.al.filter(a=>a.ind!=i);save();close();go();toast('Indicator deleted')},x:close,
sort(e){const k=e.dataset.k;U.dr=U.sk==k?-U.dr:1;U.sk=k;tb()},pg(e){U.pg+=+e.dataset.d;tb()},
addf(){modal(`<h2>Add indicator</h2><div class="g"><select id="nt">${opts(tyo)}</select><input id="nv" placeholder="Indicator value"><input id="ns" placeholder="Source (optional)"><div class="err" id="ne"></div></div><p><button class="btn" data-a="addok">Add &amp; analyze</button> <button class="btn s" data-a="x">Cancel</button></p>`)},
addok(){const r=sub($('#nt').value,$('#nv').value,$('#ns').value.trim()||USR,()=>{close();go();toast('Indicator added')});if(r!==true)$('#ne').textContent=r},
sync(e){const b=e,n=b.dataset.n;b.innerHTML='<span class="sp"></span>';setTimeout(()=>{S.fd[n]=Date.now();save();go();toast('Simulated sync complete (demo)')},800)},
af(e){U.af=e.dataset.k;go()},rd(e){const a=S.al.find(x=>x.id==e.dataset.i);a.rd=!a.rd;save();go()},rdall(){S.al.forEach(a=>a.rd=true);save();go()},
th(e){S.p.theme=e.dataset.k;thm();save();go()},
reset(){modal('<h2>Reset demo data?</h2><p class="mu">All indicators, alerts and preferences return to the original samples.</p><button class="btn d" data-a="resetok">Reset</button> <button class="btn s" data-a="x">Cancel</button>')},resetok(){S=seed();save();thm();close();go();toast('Demo data reset')},
csv(){const a=fl(),q=v=>{v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
const c=[['Indicator','Type','Risk Score','Risk Level','Source','Confidence','First Seen','Last Checked','Evidence']].concat(a.map(r=>[r.v,r.t,r.s??'',r.l,r.src,r.c,new Date(r.f).toISOString(),new Date(r.k).toISOString(),r.ev.join(' | ')])).map(r=>r.map(q).join(',')).join('\n');
try{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));l.download='cybershield-indicators.csv';l.click()}catch(x){}
modal(`<h2>CSV export (${a.length} records)</h2><p class="mu">If no file downloaded (some viewers block it), copy the text below into a .csv file.</p><textarea id="cv" rows="8" style="width:100%" readonly>${esc(c)}</textarea><p><button class="btn" data-a="cp">Copy</button> <button class="btn s" data-a="x">Close</button></p>`)},
cp(){const t=$('#cv');t.select();try{navigator.clipboard.writeText(t.value);toast('Copied')}catch(e){document.execCommand('copy')}}};
const thm=()=>document.documentElement.dataset.theme=S.p.theme;
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t);else if(e.target.id=='m')close()});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const v=e.target.type=='checkbox'?e.target.checked:e.target.value;if(f=='ps'||f=='oa'){S.p[f]=f=='ps'?+v:v;save()}else{U[f]=v;U.pg=1;tb()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='av')A.run();if(e.key=='Escape')close()});
document.addEventListener('change',e=>{if(e.target.id=='at')$('#av').placeholder={ip:'203.0.113.45',domain:'example.com',url:'https://example.com/path',hash:'MD5 / SHA-1 / SHA-256'}[e.target.value]});
load();thm();$('#nav').insertAdjacentHTML('beforeend',[['ov','◉ Overview'],['an','⌕ Threat Analyzer'],['ind','☰ Indicators'],['fd','⇄ Threat Feeds'],['al','⚑ Alerts'],['rp','▤ Reports'],['st','⚙ Settings']].map(([p,l])=>`<button data-a="nav" data-p="${p}">${l}</button>`).join(''));
go((location.hash||'').slice(1)||'ov');
</script></body></html>
